<title>Agent Relay</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2128;--mute:#667085;--line:#e3e6ea;--ok:#1a7f4b;--bad:#c62828;--warn:#b26a00;--bar:#e6e9ee;--acc:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#2a313a;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--bar:#262d36;--acc:#5b8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#2a313a;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--bar:#262d36;--acc:#5b8cff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px;padding-block:18px}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
h1{font-size:18px;margin:0}h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 4px}.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.run{background:var(--ok)}.stop{background:var(--bad)}.wait{background:var(--warn)}
.mute{color:var(--mute)}.small{font-size:12px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.bar.hi>i{background:var(--warn)}.bar.full>i{background:var(--bad)}
.big{font-size:20px;font-weight:650}.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mute)}.dot.on{background:var(--ok);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.act{font:12px ui-monospace,Consolas,monospace;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul{list-style:none;margin:0;padding:0}li{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}li:last-child{border:0}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warnc{color:var(--warn)}a{color:inherit}
.prov{border-left:4px solid var(--c,#888)}
button{font:inherit;padding:6px 14px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.go{background:var(--ok);color:#fff;border-color:var(--ok)}
select,input,textarea{font:inherit;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:90px}label.l{display:block;margin:12px 0 4px;font-weight:600}
.srow{display:grid;grid-template-columns:110px 130px 1fr 170px;gap:8px;align-items:center;padding:4px 0}
@media(max-width:640px){.srow{grid-template-columns:1fr 1fr}}
.stepper{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}
.stepper div{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;background:var(--bar);color:var(--mute);font-size:13px;cursor:default}
.stepper div.cur{background:var(--acc);color:#fff;font-weight:600}.stepper div.done{background:var(--card);border:1px solid var(--ok);color:var(--ok)}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}.tool:last-child{border:0}.tool .nm{min-width:190px}
code{font:12px ui-monospace,Consolas,monospace;background:var(--bar);padding:1px 5px;border-radius:4px}
pre.doc{white-space:pre-wrap;background:var(--bar);padding:10px;border-radius:8px;max-height:340px;overflow:auto;font:12.5px/1.45 ui-monospace,Consolas,monospace}
.drive{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.drive.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.drive .bar{flex:1;margin:0;min-width:80px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--ok);color:#fff;margin-left:6px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 16px;font-weight:600;color:var(--mute)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.chip{border-radius:99px;padding:4px 12px;font-size:13px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}.chip b{margin-left:4px}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.badge.todo{color:var(--acc);border-color:var(--acc)}.badge.owner{color:var(--warn);border-color:var(--warn)}.badge.done{color:var(--ok);border-color:var(--ok)}
table.tt{width:100%;border-collapse:collapse}table.tt td{padding:7px 8px 7px 0;border-top:1px solid var(--line);vertical-align:middle}table.tt tr.h td{border-top:0;color:var(--mute);font-size:12px}
</style>
<main>
<header><h1>Agent Relay</h1><span id="status" class="pill stop">…</span><span id="meta" class="mute"></span><span style="flex:1"></span>
  <button id="btnnew" hidden>New project</button><button id="btnstart" hidden class="go">Start</button><button id="btnstop" hidden>Stop</button><button id="btnquit" title="Close this app (a running relay keeps running)">Quit app</button><span id="clock" class="mute"></span></header>

<div id="setup" hidden>
  <div class="stepper" id="stepper"></div>
  <div id="step"></div>
</div>

<div id="dash" hidden>
  <div class="tabs"><button class="tab on" data-tab="overview">Overview</button><button class="tab" data-tab="tasks">Tasks</button><button class="tab" data-tab="setup">AIs &amp; settings</button></div>
  <div id="reqbox"></div>

  <div id="tab-overview">
    <div class="card"><h2>Now</h2><div id="now">loading…</div><ul id="next" class="small" style="margin-top:8px"></ul></div>
    <div class="grid" id="providers"></div>
    <div class="grid2" style="margin-top:12px">
      <div class="card"><h2>Next in line</h2><div id="nexttasks" class="mute">loading…</div></div>
      <div>
        <div class="card"><h2>Waiting for you</h2><div id="queue" class="mute"></div><div id="digestlink"></div></div>
        <div class="card"><h2>Done this run</h2><ul id="done"></ul></div>
      </div>
    </div>
    <div class="grid">
      <div class="card"><h2>Broke</h2><ul id="broke"></ul></div>
      <div class="card"><h2>Idle chores</h2><ul id="idle"></ul></div>
    </div>
  </div>

  <div id="tab-tasks" hidden></div>

  <div id="tab-setup" hidden>
    <div class="card"><h2>Settings: who does what (applies from the next agent call, no restart)</h2>
      <div id="setmsg"></div><div id="setform" class="mute">loading…</div>
      <div style="margin-top:10px"><button id="setsave">Save</button> <button id="setreload">Reload</button> <span class="mute small" id="setnote"></span></div></div>
    <div class="card"><h2>AI tools and sign-ins</h2><div id="dashtools"></div><div id="customarea"></div></div>
  </div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.round(Math.abs(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(x).padStart(2,"0")};
const esc=t=>String(t??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const bar=(p,mode)=>`<div class="bar ${mode==="task"?"":p>=95?"full":p>=75?"hi":""}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const NL=String.fromCharCode(10);
async function get(p){return (await fetch(p)).json()}
async function post(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});return r.json()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let MODE="setup",STEP=1,SETUP=null,ENV=null,WZ=null,CAT=null,SET=null,FAST=0,JOB=null,FORM={name:"",idea:"",stack:"",root:"",host:"local",remote:false,prov:"",model:"",effort:"",mode:"new",existPath:"",existInfo:null,taskMode:"none",taskPath:"",taskText:"",goal:"",initGit:false};
let off=0;

/* ------------------------------------------------------------ dropdown helpers */
function selOpts(items,cur,extraFirst){
  let list=items.slice();if(cur&&!list.some(x=>x.id===cur)&&cur!=="auto")list.unshift({id:cur,label:cur+" (current)"});
  let html=extraFirst||"";const groups={};list.forEach(x=>{(groups[x.group||""]=groups[x.group||""]||[]).push(x)});
  Object.keys(groups).forEach(g=>{const o=groups[g].map(x=>`<option value="${esc(x.id)}" ${x.id===cur?"selected":""}>${esc(x.label)}</option>`).join("");html+=g?`<optgroup label="${esc(g)}">${o}</optgroup>`:o});return html}
function optList(list,sel){return list.map(x=>`<option ${x===sel?"selected":""}>${x}</option>`).join("")}
function effortsFor(prov,model){const c=(CAT||{})[prov];if(!c)return[];if(prov==="codex"){const m=c.models.find(x=>x.id===model);return (m&&m.efforts)||c.efforts}return c.efforts||[]}
function usableAIs(){return ((SETUP||{}).tools||[]).filter(t=>t.found&&(t.signedIn===true||t.id==="opencode"))}
function defaultModel(p){return p==="claude"?"claude-sonnet-5-5":p==="codex"?"gpt-6.1-sol":p==="opencode"?"opencode/deepseek-v4.1-flash-free":""}

/* ------------------------------------------------------------ boot */
async function boot(){
  [SETUP,ENV,WZ,CAT]=await Promise.all([get("/api/setup"),get("/api/env"),get("/api/wizard"),get("/api/models")]);
  const p=WZ.project;
  if(p.exists&&p.hasPlan&&p.hasRelay){MODE="dash"}else{MODE="setup";STEP=firstStep()}
  apply()}
function toolsReady(){const basicsOk=SETUP.basics.every(b=>!b.needed||b.found);return basicsOk&&usableAIs().length>=2}
function firstStep(){const p=WZ.project;if(!toolsReady()&&!p.exists)return 1;if(!p.exists||!p.hasProposal)return p.exists?3:2;if(!p.hasPlan)return 3;return STEP<4?4:STEP}
function apply(){
  $("#setup").hidden=MODE!=="setup";$("#dash").hidden=MODE!=="dash";
  $("#btnnew").hidden=MODE!=="dash";
  if(MODE==="setup"){renderStepper();renderStep()}else{dashInit()}
  headerButtons()}
function headerButtons(){const p=WZ.project;$("#btnstart").hidden=!(MODE==="dash"&&p.hasRelay&&!p.running);$("#btnstop").hidden=!(MODE==="dash"&&p.running)}

/* ------------------------------------------------------------ stepper */
const STEPS=["Your AI tools","Your project","The plan","Which AI builds what","Start"];
function renderStepper(){$("#stepper").innerHTML=STEPS.map((s,i)=>`<div class="${i+1===STEP?"cur":i+1<STEP?"done":""}">${i+1<STEP?"✓ ":(i+1)+". "}${s}</div>`).join("")}
function go(n){STEP=n;renderStepper();renderStep();window.scrollTo(0,0)}
function canNext(){return true}

/* ------------------------------------------------------------ step 1: tools */
function toolRow(t){const st=(SETUP.installing||{})[t.id];const hasSign="signedIn" in t;let info;
  if(!t.found){
    const waiting=st&&st.state==="running"&&(Date.now()/1000-st.since)<1500;
    info=waiting?'<span class="warnc">⏳ installing: finish it in the terminal window that opened</span>':`<span class="mute">${t.needed?"needed":"optional"}</span> <button data-install="${t.id}">Install</button>`;
  }else{
    info='<span class="ok">✓ found</span>';
    if(hasSign){
      if(t.signedIn===true)info+=' · <span class="ok">✓ signed in</span>';
      else if(t.id==="opencode")info+=' · <span class="mute">free models need no sign-in</span>';
      else if(t.signedIn===false)info+=` · <span class="warnc">✗ not signed in</span> <button data-login="${t.id}" class="pri">Sign in</button>`;
      else info+=` · <span class="mute">sign-in can't be checked automatically</span> <button data-login="${t.id}" class="pri">Sign in</button> <button data-signed="${t.id}">I'm signed in</button>`}}
  return `<div class="tool"><span class="nm"><b>${esc(t.name)}</b>${t.role?'<br><span class="mute small">'+esc(t.role)+"</span>":""}</span><span>${info}</span></div>`}
function wireToolButtons(root){
  root.querySelectorAll("[data-install]").forEach(b=>b.onclick=async()=>{const id=b.dataset.install,t=[...SETUP.basics,...SETUP.tools].find(x=>x.id===id);
    if(confirm("Install "+t.name+"?"+NL+NL+"A terminal window opens and runs:"+NL+t.how+NL+NL+"It downloads software to this computer. Answer anything it asks, then come back here.")){
      const r=await post("/api/install-tool",{id});if(!r.ok)alert(r.error);fastPoll();refreshSetup()}});
  root.querySelectorAll("[data-login]").forEach(b=>b.onclick=async()=>{const r=await post("/api/login-tool",{id:b.dataset.login});alert(r.ok?r.message+NL+NL+"This page updates by itself when you are signed in.":r.error);fastPoll()});
  root.querySelectorAll("[data-signed]").forEach(b=>b.onclick=async()=>{await post("/api/mark-signed-in",{id:b.dataset.signed});refreshSetup()})}
function fastPoll(){FAST=Date.now()+600000}
async function refreshSetup(){SETUP=await get("/api/setup");if(MODE==="setup"&&STEP===1)drawTools();if(MODE==="dash")drawDashTools()}
function stepTools(){
  $("#step").innerHTML=`<div class="card"><h3>1. Your AI tools</h3>
    <div class="mute">The relay needs at least two different AIs: one builds, a second one checks the work. Install what is missing and sign in. Anything marked optional can wait.</div>
    <div id="toolsbox"></div><div id="toolsmsg" style="margin-top:10px"></div>
    <details style="margin-top:10px"><summary><b>Add another AI</b> <span class="mute small">Antigravity, Gemini CLI, Aider, anything with a command-line tool</span></summary><div id="customarea1"></div></details>
    <div class="nav"><span></span><button id="next1" class="pri">Continue</button></div></div>`;
  drawTools();renderCustom("#customarea1");
  $("#next1").onclick=()=>{if(!toolsReady()&&!confirm("Some things are still missing (see above). Continue anyway?"))return;go(2)}}
function drawTools(){
  const miss=SETUP.basics.filter(b=>!b.found);
  $("#toolsbox").innerHTML=(miss.length?"<h2 style='margin-top:12px'>Needed first</h2>"+miss.map(toolRow).join(""):`<div class="mute small" style="margin:8px 0">✓ ${SETUP.basics.map(b=>b.name.split(" (")[0]).join(", ")} found</div>`)+
    "<h2 style='margin-top:12px'>AI tools</h2>"+SETUP.tools.map(toolRow).join("");
  wireToolButtons($("#toolsbox"));
  const u=usableAIs(),ok=toolsReady();
  $("#toolsmsg").innerHTML=ok?`<span class="ok">✓ Ready: ${u.map(t=>esc(t.name)).join(", ")} can work for you.</span>`:
    `<span class="warnc">${!SETUP.basics.every(b=>!b.needed||b.found)?"Install the basics above first. ":""}${u.length<2?`You have ${u.length} usable AI; the relay wants two different ones (OpenCode's free models count).`:""}</span>`;
  const n=$("#next1");if(n){n.className=ok?"pri":"";n.textContent=ok?"Continue":"Continue anyway"}}

/* ------------------------------------------------------------ custom AIs */
function renderCustom(sel){
  $(sel).innerHTML=`<div class="mute small" style="margin:6px 0">Type its name and the command you use to start it. The app finds it, asks it for its models and reasoning levels, and adds it to every dropdown.</div>
   <div class="row2"><input id="ca_name" size="22" placeholder="Name, e.g. Antigravity"> <input id="ca_bin" size="26" placeholder="Command, e.g. agy"> <button id="ca_find">Find it</button></div>
   <div id="ca_result" style="margin-top:8px"></div><div id="ca_list" style="margin-top:8px"></div>`;
  $("#ca_find").onclick=async()=>{$("#ca_result").innerHTML='<span class="warnc">Looking…</span>';
    const r=await post("/api/custom/probe",{bin:$("#ca_bin").value.trim()});
    if(!r.ok){$("#ca_result").innerHTML='<span class="bad">'+esc(r.error)+"</span>";return}
    $("#ca_result").innerHTML=`<div><span class="ok">✓ found</span> <span class="mute small">${esc(r.found)}</span></div>
      <div>${r.models.length?`<span class="ok">${r.models.length} models listed by the tool</span> <span class="mute small">${esc(r.models.slice(0,6).join(", "))}${r.models.length>6?"…":""}</span>`:'<span class="warnc">The tool did not list its models; it will use its own default.</span>'}</div>
      <div>${r.efforts.length?`<span class="ok">reasoning levels: ${esc(r.efforts.join(", "))}</span>`:'<span class="mute">no reasoning level found</span>'}</div>
      <div class="mute" style="margin-top:4px">How to start it for one task (leave empty if you are not sure):</div>
      <div class="row2"><input id="ca_args" size="30" placeholder="extra words after the command, e.g. run"> <button class="pri" id="ca_add">Add this AI</button></div>
      <div class="mute small" style="margin-top:4px">The relay cannot stop a tool it does not know from using git, so custom AIs are marked experimental and are best used as a backup builder.</div>`;
    $("#ca_add").onclick=async()=>{const a=await post("/api/custom/add",{name:$("#ca_name").value.trim(),bin:$("#ca_bin").value.trim(),args:$("#ca_args").value.trim()});
      if(!a.ok){$("#ca_result").innerHTML+='<div class="bad">'+esc(a.error)+"</div>";return}
      $("#ca_result").innerHTML='<span class="ok">✓ added. It is in the dropdowns now.</span>';CAT=await get("/api/models");await refreshSetup();customList()}};
  customList()}
async function customList(){const s=await get("/api/setup");const c=(s.tools||[]).filter(t=>t.custom);const el=$("#ca_list");if(!el)return;
  el.innerHTML=c.length?"<b>Your added AIs</b>"+c.map(t=>`<div class="tool"><span class="nm"><b>${esc(t.name)}</b></span><span>${t.found?'<span class="ok">✓ found</span>':'<span class="bad">not found</span>'}</span><button data-carefresh="${t.id}">Refresh models</button><button data-caremove="${t.id}">Remove</button></div>`).join(""):"";
  el.querySelectorAll("[data-caremove]").forEach(b=>b.onclick=async()=>{if(confirm("Remove "+b.dataset.caremove+" from this project?")){await post("/api/custom/remove",{id:b.dataset.caremove});CAT=await get("/api/models");customList();refreshSetup()}});
  el.querySelectorAll("[data-carefresh]").forEach(b=>b.onclick=async()=>{const r=await post("/api/custom/refresh",{id:b.dataset.carefresh});alert(r.ok?r.count+" models found.":r.error);CAT=await get("/api/models")})}

/* ------------------------------------------------------------ step 2: project */
function cleanName(n){return n.replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim()}
function suggestName(idea){return cleanName(idea.split(/\s+/).slice(0,3).join(" ")).slice(0,30)}
function joinPath(base,name){const sep=ENV.os==="windows"?"\\":"/";return base.replace(/[\\/]+$/,"")+sep+name}
function projectsRoot(d){return joinPath(d.path,"Projects")}
function stepProject(){
  $("#step").innerHTML=`<div class="card"><h3>2. Your project</h3>
    <div class="row2" style="margin-top:6px"><label class="opt"><input type="radio" name="pm" value="new" ${FORM.mode==="new"?"checked":""}><div><b>Start something new</b><div class="mute small">Tell the AI your idea. It plans the project and builds it.</div></div></label>
    <label class="opt"><input type="radio" name="pm" value="existing" ${FORM.mode==="existing"?"checked":""}><div><b>I already have a project</b><div class="mute small">Pick its folder. Give the AI your task list, or let it read the project and write the tasks.</div></div></label></div></div><div id="pbody"></div>`;
  document.querySelectorAll("[name=pm]").forEach(r=>r.onchange=()=>{FORM.mode=r.value;stepProject()});
  if(FORM.mode==="existing")stepExisting();else stepProjectNew()}
function stepProjectNew(){
  const ds=ENV.drives;if(!FORM.root){const rec=ds.find(d=>d.path===ENV.recommended)||ds[0];FORM.root=rec?projectsRoot(rec):""}
  const stacks=["","Website: Next.js + TypeScript","Website: Python + Flask","Website: plain HTML, CSS and JavaScript","Mobile app: React Native (Expo)","Desktop app: Electron + TypeScript","Game: Godot 4 (GDScript)","Game: Unity (C#)","Game in the browser: Phaser + TypeScript","Command-line tool: Python","Command-line tool: Node.js","Backend API: Java + Spring Boot","Backend API: Python + FastAPI","Data / automation scripts: Python"];
  const u=usableAIs();if(!FORM.prov){const c=u.find(t=>t.id==="claude")||u.find(t=>t.id==="codex")||u[0];FORM.prov=c?c.id:""}
  $("#pbody").innerHTML=`<div class="card">
   <label class="l">What do you want to build?</label>
   <textarea id="f_idea" placeholder="For example: a small website where my football club can post results and show a league table.">${esc(FORM.idea)}</textarea>
   <label class="l">Name</label><input id="f_name" size="30" placeholder="Short name for the project" value="${esc(FORM.name)}">
   <label class="l">Tech stack <span class="mute small" style="font-weight:400">(the tools it is built with)</span></label>
   <div class="row2"><select id="f_stack">${stacks.map(s=>`<option value="${esc(s)}" ${s===FORM.stack?"selected":""}>${s||"I don't know: let the AI suggest one"}</option>`).join("")}<option value="__other" ${FORM.stack==="__other"?"selected":""}>Something else (type it)</option></select>
     <input id="f_stack_o" size="28" placeholder="Your tech stack" value="${esc(FORM.stackOther||"")}" ${FORM.stack==="__other"?"":"hidden"}></div>
   <label class="l">Where should it live?</label>
   <div class="mute small">The app picked the disk with the most free space. Change it if you like.</div>
   <div id="drives"></div>
   <div class="mute small" id="pathprev" style="margin-top:6px"></div>
   <label class="l">Save it online?</label>
   <div id="hostbox"></div>
   <label class="l">Which AI plans the project?</label>
   <div class="row2"><select id="f_prov">${u.map(t=>`<option value="${t.id}" ${t.id===FORM.prov?"selected":""}>${esc(t.name)}</option>`).join("")||"<option value=''>no AI is ready: go back to step 1</option>"}</select><select id="f_model"></select><select id="f_effort"></select>

  await post("/api/project/forget");MODE="setup";STEP=2;JOB=null;FORM={name:"",idea:"",stack:"",root:FORM.root,host:"local",remote:false,prov:FORM.prov,model:"",effort:""};WZ=await get("/api/wizard");apply()};
$("#btnquit").onclick=async()=>{if(confirm("Close the Agent Relay app?"+NL+NL+"A relay that is running keeps running; this only closes the window and the page.")){await post("/api/quit");document.body.innerHTML='<main><div class="card">Agent Relay has closed. You can close this tab. Open the app again to come back.</div></main>'}};
setInterval(()=>{$("#clock").textContent=new Date().toLocaleTimeString();if(MODE==="dash")tick()},3000);
setInterval(()=>{if(Date.now()<FAST||(MODE==="setup"&&STEP===1))refreshSetup()},4000);
boot();
</script>
