name: Release

# Builds the app for Windows and Linux, starts each build to check it comes up, and publishes a release when a tag like v0.2.0 is pushed.
# Run it by hand (Actions tab, Run workflow) to build without releasing: the files are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app (a folder, zipped)
        shell: pwsh
        run: ./build-app.ps1
      - name: Check the engine starts
        shell: bash
        run: |
          AGENT_RELAY_NO_WINDOW=1 ./dist/AgentRelay/AgentRelay.exe --port 8791 &
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:8791/api/env > env.json; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "the app did not start"; exit 1; }
          cat env.json | head -c 300; echo
          curl -fs http://127.0.0.1:8791/api/wizard | head -c 200; echo
          curl -fs http://127.0.0.1:8791/assets/agent-relay.svg | head -c 80; echo
          curl -s -X POST http://127.0.0.1:8791/api/quit -H 'Content-Type: application/json' -d '{}' || true
      - name: Check the Windows desktop window opens
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/AgentRelay/AgentRelay.exe -ArgumentList '--port','8792' -WindowStyle Hidden -PassThru
          $ready = $false
          try {
            foreach ($attempt in 1..40) {
              $app.Refresh()
              if ($app.HasExited) { break }
              $view = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe' AND ParentProcessId = $($app.Id)"
              if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -eq 'Agent Relay' -and $view) {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              if (Test-Path ~/.agent-relay-window-error.log) { Get-Content ~/.agent-relay-window-error.log }
              throw 'Agent Relay did not open a native WebView2 window.'
            }
          } finally {
            if (-not $app.HasExited) {
              try { Invoke-RestMethod http://127.0.0.1:8792/api/quit -Method Post -ContentType application/json -Body '{}' -TimeoutSec 3 | Out-Null }
              catch {}
              if (-not $app.WaitForExit(5000)) { Stop-Process -Id $app.Id }
            }
          }
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp dist/AgentRelay-windows-x64.zip out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries the Qt web engine needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxkbcommon-x11-0 libxcb-cursor0 libasound2 libgl1 libegl1 libgbm1 libstdc++6 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xkb1
      - name: Build the app (a folder)
        run: bash ./build-app.sh
      - name: Check the engine starts
        run: |
          AGENT_RELAY_NO_WINDOW=1 ./dist/AgentRelay/AgentRelay --port 8791 &
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:8791/api/env > env.json; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "the app did not start"; exit 1; }
          cat env.json | head -c 300; echo
          curl -fs http://127.0.0.1:8791/api/wizard | head -c 200; echo
          curl -s -X POST http://127.0.0.1:8791/api/quit -H 'Content-Type: application/json' -d '{}' || true
          sleep 2
      - name: Check the window opens (virtual display)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: |
          ./dist/AgentRelay/AgentRelay --port 8792 > window.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:8792/api/env > /dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "no answer"; cat window.log; exit 1; }
          sleep 12
          kill -0 $pid || { echo "the app exited while showing its window"; cat window.log; exit 1; }
          ls ~/.agent-relay-window-error.log 2>/dev/null && { cat ~/.agent-relay-window-error.log; exit 1; } || echo "window code ran without error"
          kill $pid || true
      - name: Package
        run: |
          mkdir out
          chmod +x dist/AgentRelay/AgentRelay
          tar -czf out/AgentRelay-linux-x86_64.tar.gz -C dist AgentRelay
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notes
        run: |
          cat > notes.md <<'EOF'
          Agent Relay turns an idea (or a project you already have) into a plan and builds it task by task with several AI tools, while you watch. It is a desktop app with its own window.

          **Windows (10 or 11):** download `AgentRelay-windows-x64.zip`, extract it, and double-click `AgentRelay.exe`. If WebView2 is missing, Agent Relay offers to install the Microsoft runtime. For browser mode, run `AgentRelay.exe --open`.

          **Linux (x86_64, a normal desktop):** download `AgentRelay-linux-x86_64.tar.gz`, then `tar -xzf AgentRelay-linux-x86_64.tar.gz && ./AgentRelay/AgentRelay`.
          It needs a few system libraries, including the graphics driver and C++ runtime. On Debian or Ubuntu: `sudo apt install libnss3 libxkbcommon-x11-0 libxcb-cursor0 libasound2 libgl1 libgbm1 libstdc++6`.
          The Linux build starts, answers, and runs its window code on a clean Linux machine in the release check, but its terminals, package installs and relay start have not been used by a person yet. Please report problems.

          The app helps you install the AI tools and sign in. Projects use git and Python 3 for the relay scripts; the first screen checks for them. `SHA256SUMS.txt` has the checksums.
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Agent Relay ${GITHUB_REF_NAME#v}" --notes-file notes.md
